[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-jp-accounting-bench"
version = "0.1.0"
description = "Japanese accounting and financial reasoning benchmarks adapted for Jev-compatible System One models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27,<1",
  "jfinqa>=0.3.2",
  "datasets>=3,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
jev-accounting-bench = "bench:main"

[tool.setuptools]
py-modules = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
